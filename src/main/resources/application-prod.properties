# ===============================
# Production Properties (Profile: prod)
# ===============================

# Native environment file import
spring.config.import=optional:file:.env.prod[.properties]

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# Ensure production PostgreSQL creates app-owned tables on startup.
# Hibernate update remains enabled, and this script covers missing tables on Render.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-postgresql.sql
spring.sql.init.continue-on-error=true

# Auth Service
app.auth-service.url=${APP_AUTH_SERVICE_URL}
app.auth-service.base-url=${APP_AUTH_SERVICE_BASE_URL}
app.auth-service.validate-token-endpoint=${APP_AUTH_VALIDATE_ENDPOINT}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Admin Email
app.admin-email=${APP_ADMIN_EMAIL:support@chaitanyatechworld.com}

# Logging
logging.level.root=WARN
logging.level.com.job.portal=INFO

