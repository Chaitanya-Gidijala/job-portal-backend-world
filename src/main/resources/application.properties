# ===============================
# Common Spring Application
# ===============================
spring.application.name=JobPortal
# Remove global .env import to prevent cross-profile leakage
# spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

# Default Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Render.com Compatibility
server.address=0.0.0.0
spring.jpa.open-in-view=false

# ===============================
# Common Settings
# ===============================

# JWT (Keys should be in .env)
app.jwt-secret=${APP_JWT_SECRET}
app.jwt-expiration-milliseconds=604800000

# Brevo API
brevo.api.key=${BREVO_API_KEY}
brevo.api.url=https://api.brevo.com/v3/smtp/email

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# Optimization
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# GitHub Repository for Images (Image Manager module)
github.api.token=${GITHUB_API_TOKEN:}
github.api.owner=Chaitanya-Gidijala
github.api.repo=company-images

# GitHub Repository for Prompt Gallery assets (separate dedicated repo)
# Set GITHUB_PROMPT_TOKEN env var to a Fine-Grained PAT scoped to this repo only.
# How to create: GitHub → Settings → Developer settings → Fine-grained tokens
#   → Repository access: Only "company-images" (or a new dedicated repo)
#   → Permissions: Contents → Read and Write
prompt.github.token=${GITHUB_PROMPT_TOKEN:${GITHUB_API_TOKEN:}}
prompt.github.owner=Chaitanya-Gidijala
prompt.github.repo=company-images
prompt.github.branch=main

# Multipart upload size limits (allow up to 10 MB for raw mobile photos before client-side compression)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
